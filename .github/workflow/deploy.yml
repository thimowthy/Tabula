name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build e deploy
        run: |
          docker compose down
          docker compose up -d --build

      - name: Limpar imagens antigas
        run: |
          docker image prune -f