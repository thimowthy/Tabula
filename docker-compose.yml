services:
  server:
    build: ./server
    ports:
      - "8420:8420"
    environment:
      TABULA_SECRET_KEY: ${TABULA_SECRET_KEY:-dev-only-insecure-secret-change-me-before-any-real-deploy}
      TABULA_DB_URL: sqlite:////data/tabula.db
      TABULA_CORS_ORIGINS: http://localhost:5173,http://tabula.adpromotora.local:5173
    volumes:
      # Bind-mount the source (not the whole build context) so `--reload`
      # picks up edits without rebuilding the image; the sqlite file lives
      # on a named volume instead, so the catalog survives `compose down`.
      - ./server/src:/app/src
      - server-data:/data

  frontend:
    build: .
    ports:
      - "5173:5173"
    environment:
      # The browser (not the frontend container) is what calls this URL, so
      # it has to be the host-mapped port, not the in-network service name.
      VITE_API_BASE_URL: http://localhost:8420
    volumes:
      - ./:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  server-data:
