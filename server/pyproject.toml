[project]
name = "tabula-server"
version = "0.1.0"
description = "Accounts and workflow catalog API for Tabula — user auth, and named/tagged workflow storage"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tabula_server"]

[tool.pytest.ini_options]
pythonpath = ["src"]
